name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build.cjs
      - run: node --check main.js
      - run: node --test test/*.test.cjs
      - run: git diff --exit-code -- main.js
